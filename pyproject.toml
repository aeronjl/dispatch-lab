[project]
name = "plant-playground"
version = "0.1.0"
description = "A local solar, battery and electrolyser control experiment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.0,<7",
    "numpy>=2.0,<3",
    "scipy>=1.16,<2",
    "plotly>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
