[project]
name = "plant-playground"
version = "0.3.0"
description = "An explainable autonomous solar-to-methane scheduling sandbox."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.0,<7",
    "numpy>=2.0,<3",
    "scipy>=1.16,<2",
    "plotly>=6.0,<7",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "rasterio>=1.4,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Historical research scripts retain the exact form recorded by their protocols.
# Their separate environments and validation records are documented in research/.
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
